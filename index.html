<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<title>早押しクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0b0d1a;--bg2:#141833;--card:#171b36cc;--line:#2a3060;--tx:#f4f5ff;--mu:#8e94c4;
  --y:#ffd23f;--r:#ff3b5c;--g:#1fe08f;--b:#4c6fff;
  --disp:"Dela Gothic One",sans-serif;--body:"Zen Kaku Gothic New",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--tx);font-family:var(--body);font-weight:700;user-select:none;-webkit-user-select:none;
  background:radial-gradient(ellipse 90% 60% at 50% -10%,#2a2f7a 0%,transparent 60%),
             repeating-linear-gradient(115deg,transparent 0 38px,#ffffff05 38px 76px),var(--bg);
  min-height:100dvh;transition:background-color .2s;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.hide{display:none!important}

/* header */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-family:var(--disp);font-size:22px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--y);color:var(--bg);font-size:18px;transform:rotate(-8deg);box-shadow:3px 3px 0 var(--r)}
.net{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.net b{width:8px;height:8px;border-radius:50%;background:#555;box-shadow:0 0 0 3px #5553}
.net.on b{background:var(--g);box-shadow:0 0 0 3px #1fe08f33}

/* common */
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
.lbl{font-size:12px;color:var(--mu);letter-spacing:.12em;margin-bottom:10px}
input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#0b0d1a;color:var(--tx);outline:none;transition:border-color .15s}
input:focus{border-color:var(--y)}
input.code{font-family:var(--disp);font-size:34px;letter-spacing:.4em;text-align:center;padding:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:15px 18px;font-weight:900;font-size:17px;color:var(--tx);background:#262c58;transition:transform .08s,filter .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.35;cursor:default}
.btn-y{background:var(--y);color:var(--bg);box-shadow:0 5px 0 #b8901a}
.btn-r{background:var(--r);box-shadow:0 5px 0 #a91d38}
.btn-g{background:var(--g);color:#05301d;box-shadow:0 5px 0 #11905a}
.btn-ghost{background:transparent;border:2px solid var(--line);color:var(--mu)}
.btn-y:active:not(:disabled),.btn-r:active:not(:disabled),.btn-g:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #0006}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack>*+*{margin-top:12px}
.msg{min-height:1.2em;font-size:14px;color:var(--r);text-align:center;margin-top:10px}
.link{background:none;padding:6px;color:var(--mu);font-size:14px;text-decoration:underline;text-underline-offset:3px;box-shadow:none;width:100%}

/* join */
.hero{text-align:center;margin:8px 0 24px}
.hero h1{font-family:var(--disp);font-size:clamp(40px,11vw,68px);line-height:1.05;margin:0;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 30%,var(--y));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(4px 4px 0 var(--r))}
.hero p{color:var(--mu);margin:10px 0 0;font-size:14px}
.roomtag{display:inline-flex;align-items:center;gap:10px;background:#0b0d1a;border:2px dashed var(--y);border-radius:14px;padding:8px 16px;margin-bottom:14px}
.roomtag span{font-size:12px;color:var(--mu)}
.roomtag b{font-family:var(--disp);font-size:28px;letter-spacing:.2em;color:var(--y)}
.resume{border-color:var(--y)}

/* player */
#player{min-height:calc(100dvh - 90px);display:flex;flex-direction:column}
.pbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}
.pbar b{color:var(--tx);font-size:16px}
.pstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0}
#pstat{font-family:var(--disp);font-size:clamp(22px,6vw,30px);text-align:center;min-height:1.5em;margin-bottom:22px;letter-spacing:.04em}
.bz-wrap{position:relative;width:min(80vw,360px);aspect-ratio:1}
.bz-wrap::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,#2b3166,#1a1e40,#2b3166);box-shadow:inset 0 4px 12px #0008}
#buzz{position:absolute;inset:0;border-radius:50%;font-family:var(--disp);font-size:clamp(40px,12vw,58px);letter-spacing:.06em;color:#fff;
  background:radial-gradient(circle at 38% 28%,#ff8a9d 0%,var(--r) 45%,#b3133a 100%);
  box-shadow:0 16px 0 #7c0c27,0 24px 40px #000a,inset 0 -10px 24px #0004;transition:transform .06s,box-shadow .06s,filter .2s}
#buzz:disabled{opacity:1;filter:grayscale(1) brightness(.55)}
#buzz.on{animation:pulse 1.2s ease-in-out infinite}
#buzz:active:not(:disabled),#buzz.hit{transform:translateY(13px);box-shadow:0 3px 0 #7c0c27,0 8px 16px #000a,inset 0 -6px 18px #0004}
@keyframes pulse{0%,100%{box-shadow:0 16px 0 #7c0c27,0 24px 40px #000a,0 0 0 0 #ff3b5c88}50%{box-shadow:0 16px 0 #7c0c27,0 24px 40px #000a,0 0 0 22px #ff3b5c00}}
#psub{margin-top:30px;font-size:15px;color:var(--mu);text-align:center;min-height:1.3em}
body.win{background-color:#0d3b2a}
body.win #pstat{color:var(--g);font-size:clamp(44px,13vw,72px);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
body.ng #pstat{color:var(--r)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

/* score */
table{width:100%;border-collapse:collapse}
td{padding:10px 6px;border-bottom:1px solid var(--line);font-size:17px}
tr:last-child td{border-bottom:0}
td.rk{width:34px;font-family:var(--disp);color:var(--mu)}
tr:first-child td.rk{color:var(--y)}
td.s{text-align:right;font-family:var(--disp);font-size:22px;width:60px}
td.b{width:100px;text-align:right;white-space:nowrap}
td.b button{padding:6px 12px;margin-left:4px;font-size:15px;border-radius:10px}
tr.me td{color:var(--y)}
.empty{color:var(--mu);font-size:14px;font-weight:500}

/* host */
.hroom{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
#qr{background:#fff;padding:10px;border-radius:14px;width:152px;height:152px}
#qr img,#qr canvas{width:132px!important;height:132px!important;display:block}
.hcode{font-family:var(--disp);font-size:clamp(40px,10vw,56px);letter-spacing:.18em;color:var(--y);line-height:1}
.hhelp{font-size:13px;color:var(--mu);margin:6px 0 12px;font-weight:500}
.hroom .row button{padding:10px 12px;font-size:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.qno{font-family:var(--disp);font-size:20px}
.pill{font-size:13px;padding:6px 12px;border-radius:99px;background:#262c58;color:var(--mu)}
.pill.open{background:var(--r);color:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.6}}
#big{min-height:110px;display:grid;place-items:center;text-align:center;margin:8px 0 14px;border-radius:16px;background:#0b0d1a;border:2px solid var(--line);padding:10px}
#big .nm{font-family:var(--disp);font-size:clamp(36px,10vw,60px);color:var(--g);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
#big .wait{color:var(--mu);font-size:16px}
#big.has{border-color:var(--g);box-shadow:0 0 0 4px #1fe08f22}
.acts>*+*{margin-top:12px}
ol{margin:0;padding:0;list-style:none}
ol li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#0b0d1a;margin-bottom:8px;font-size:20px;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(-16px);opacity:0}}
ol li .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#262c58;font-family:var(--disp);font-size:16px;flex:none}
ol li.cur{background:#0d3b2a;outline:2px solid var(--g)}ol li.cur .n{background:var(--g);color:#05301d}
ol li.out{opacity:.35;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:6px 12px;border-radius:99px;background:#0b0d1a;border:1px solid var(--line);font-size:14px}
.cnt{float:right;font-family:var(--disp);color:var(--tx);font-size:14px;letter-spacing:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--y);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:420px){.hroom{grid-template-columns:1fr;justify-items:center;text-align:center}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i>!</i>早押しクイズ</div>
    <div class="net" id="net"><b></b><span>接続中…</span></div>
  </header>

  <!-- ===== 参加画面 ===== -->
  <section id="join">
    <div class="hero"><h1>早押し<br>クイズ</h1><p>スマホがそのまま早押しボタンになります</p></div>

    <div id="resumeCard" class="card resume hide">
      <div class="lbl">前回の部屋</div>
      <button class="btn-y" id="resumeBtn" style="width:100%"></button>
    </div>

    <!-- 参加 -->
    <div class="card stack" id="joinCard">
      <div class="lbl">参加する</div>
      <div id="roomTag" class="hide" style="text-align:center"><div class="roomtag"><span>部屋</span><b id="roomTagNo"></b></div></div>
      <input id="code" class="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" aria-label="部屋番号">
      <input id="nm" maxlength="12" placeholder="あなたの名前" autocomplete="nickname">
      <button class="btn-r" id="asP" style="width:100%">参加する</button>
      <div class="msg" id="jmsg"></div>
    </div>

    <div class="card stack">
      <div class="lbl">司会をする</div>
      <button class="btn-ghost" id="asH" style="width:100%">新しく部屋を作る</button>
    </div>
  </section>

  <!-- ===== プレイヤー画面 ===== -->
  <section id="player" class="hide">
    <div class="pbar"><span>部屋 <b id="pRoom"></b></span><span><b id="pName"></b></span></div>
    <div class="pstage">
      <div id="pstat">待機中</div>
      <div class="bz-wrap"><button id="buzz" disabled>押す</button></div>
      <div id="psub"></div>
    </div>
    <div class="card"><div class="lbl">スコア</div><table id="pscore"></table></div>
  </section>

  <!-- ===== 司会画面 ===== -->
  <section id="host" class="hide">
    <div class="card">
      <div class="hroom">
        <div id="qr"></div>
        <div>
          <div class="lbl" style="margin:0">部屋番号</div>
          <div class="hcode" id="hcode"></div>
          <div class="hhelp">QRを読み取るか、部屋番号を入力して参加</div>
          <div class="row"><button id="copy">🔗 コピー</button><button id="share">📤 共有</button></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="qhead"><span class="qno">第 <span id="qno">0</span> 問</span><span id="hst" class="pill">待機中</span></div>
      <div id="big"><span class="wait">「出題」を押すと受付が始まります</span></div>
      <div class="acts">
        <div class="row">
          <button class="btn-g" id="right" disabled>⭕ 正解</button>
          <button class="btn-r" id="wrong" disabled>❌ 不正解</button>
        </div>
        <button class="btn-y" id="start" style="width:100%">▶ 出題する</button>
        <button class="btn-ghost" id="stop" disabled style="width:100%">この問題を締め切る</button>
      </div>
    </div>

    <div class="card"><div class="lbl">押した順</div><ol id="order"></ol></div>
    <div class="card"><div class="lbl">スコア</div><table id="hscore"></table>
      <button class="link" id="reset">スコアをリセット</button></div>
    <div class="card"><div class="lbl">参加者 <span class="cnt"><span id="pc">0</span> 人</span></div><div class="chips" id="plist"></div></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script type="module">
// ===== Firebase設定 =====
const firebaseConfig = {
  apiKey: "AIzaSyBaT3HPI5pUFiwX9ARcJgXOSgRX0jVySyk",
  authDomain: "hayaoshi-4a3df.firebaseapp.com",
  databaseURL: "https://hayaoshi-4a3df-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hayaoshi-4a3df",
  storageBucket: "hayaoshi-4a3df.firebasestorage.app",
  messagingSenderId: "131340992531",
  appId: "1:131340992531:web:e1f26e91f9bb692ee93fe6"
};
// =======================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, onValue, serverTimestamp, increment, onDisconnect, get, remove }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $=id=>document.getElementById(id);
const clip=s=>String(s??'').slice(0,12);
const db=getDatabase(initializeApp(firebaseConfig));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let pid=ls.get('hy_pid'); if(!pid){pid=Math.random().toString(36).slice(2,10);ls.set('hy_pid',pid)}

// ---- 接続表示 ----
onValue(ref(db,'.info/connected'),s=>{const on=!!s.val();$('net').classList.toggle('on',on);$('net').lastElementChild.textContent=on?'オンライン':'接続中…'});

// ---- トースト・音 ----
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
let ac=null;
function tone(f,d,type='square',v=.18,at=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={
  buzz:()=>{tone(988,.12);tone(1319,.35,'square',.18,.11)},
  tap:()=>tone(880,.08),
  start:()=>{tone(523,.08,'triangle',.2);tone(784,.15,'triangle',.2,.08)},
  ok:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.2,i*.09))},
  ng:()=>{tone(180,.45,'sawtooth',.15)},
  next:()=>tone(600,.07)
};
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

// ---- 参加画面の初期化 ----
const url=new URLSearchParams(location.search);
const qRoom=(url.get('r')||'').replace(/\D/g,'').slice(0,4);
$('nm').value=ls.get('hy_name')||'';
if(qRoom.length===4){
  $('code').value=qRoom;$('code').classList.add('hide');
  $('roomTag').classList.remove('hide');$('roomTagNo').textContent=qRoom;
  $('asP').textContent=`部屋 ${qRoom} に参加する`;
  setTimeout(()=>$('nm').focus(),300);
}
$('code').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);if(e.target.value.length===4)$('nm').focus()});
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')$('asP').click()});

// 司会の再開
const lastHost=JSON.parse(ls.get('hy_host')||'null');
if(lastHost&&Date.now()-lastHost.at<6*3600e3&&!qRoom){
  get(ref(db,`rooms/${lastHost.code}/state`)).then(s=>{if(s.exists()){$('resumeCard').classList.remove('hide');$('resumeBtn').textContent=`司会として部屋 ${lastHost.code} に戻る`}});
  $('resumeBtn').onclick=()=>startHost(lastHost.code);
}

// ---- 共有状態 ----
let role=null, code='', myName='';
let S={q:0,round:0,status:'idle'}, buzz=[], out={}, scores={}, players={};
let unsubRound=[];
const R=p=>ref(db,`rooms/${code}/${p}`);
const cur=()=>buzz.find(b=>!out[b.id])||null;

function scoreTable(el,editable){
  el.innerHTML='';
  const ent=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  if(!ent.length){el.innerHTML='<tr><td class="empty">まだ得点はありません</td></tr>';return}
  ent.forEach(([n,s],i)=>{
    const tr=document.createElement('tr');if(role==='player'&&n===myName)tr.className='me';
    const r=document.createElement('td');r.className='rk';r.textContent=i+1;
    const a=document.createElement('td');a.textContent=n;
    const b=document.createElement('td');b.className='s';b.textContent=s;tr.append(r,a,b);
    if(editable){const c=document.createElement('td');c.className='b';
      for(const d of [-1,1]){const bt=document.createElement('button');bt.textContent=d>0?'＋':'－';bt.onclick=()=>update(R('scores'),{[n]:increment(d)});c.append(bt)}
      tr.append(c)}
    el.append(tr);
  });
}
const render=()=>role==='host'?renderHost():renderPlayer();

// ---- 司会画面 ----
let lastCur=null;
function renderHost(){
  $('qno').textContent=S.q||0;
  const open=S.status==='open';
  $('hst').textContent=open?'受付中':'待機中';$('hst').className='pill'+(open?' open':'');
  const c=cur(), big=$('big');
  if(c){if(lastCur!==c.id){big.innerHTML='';const s=document.createElement('span');s.className='nm';s.textContent=c.name;big.append(s)}big.classList.add('has')}
  else{big.classList.remove('has');big.innerHTML=`<span class="wait">${open?'ボタンが押されるのを待っています…':'「出題する」を押すと受付が始まります'}</span>`}
  lastCur=c?.id||null;
  $('right').disabled=$('wrong').disabled=!c;
  $('stop').disabled=!open;
  $('start').textContent=S.q?'▶ 次の問題を出題':'▶ 出題する';
  const ol=$('order');ol.innerHTML='';
  buzz.forEach((b,i)=>{const li=document.createElement('li');if(b===c)li.className='cur';else if(out[b.id])li.className='out';
    const n=document.createElement('span');n.className='n';n.textContent=i+1;const t=document.createElement('span');t.textContent=b.name;li.append(n,t);ol.append(li)});
  if(!buzz.length)ol.innerHTML='<li class="empty" style="font-size:14px;animation:none">まだ誰も押していません</li>';
  scoreTable($('hscore'),true);
  const ps=Object.values(players);$('pc').textContent=ps.length;
  const pl=$('plist');pl.innerHTML='';
  if(!ps.length)pl.innerHTML='<span class="empty" style="border:0;background:none">QRコードから参加してもらいましょう</span>';
  ps.forEach(p=>{const s=document.createElement('span');s.textContent=clip(p.name);pl.append(s)});
}

// ---- プレイヤー画面 ----
let pressed=0, lastState='';
function setP(state,stat,btn,sub,enabled){
  const b=$('buzz');
  document.body.classList.toggle('win',state==='win');document.body.classList.toggle('ng',state==='out');
  $('pstat').textContent=stat;b.textContent=btn;$('psub').textContent=sub;
  b.disabled=!enabled;b.classList.toggle('on',enabled);
  if(state!==lastState){if(state==='win'){sfx.buzz();vib([80,40,200])}else if(state==='open'){vib(30)}else if(state==='out'&&lastState==='win'){sfx.ng()}}
  lastState=state;
}
function renderPlayer(){
  scoreTable($('pscore'),false);
  if(S.status!=='open'){setP('idle',S.q?'次の問題を待っています':'まもなく開始','待機','司会が出題するとボタンが押せるようになります',false);return}
  if(out[pid]){setP('out','残念…','✕','この問題はもう回答できません',false);return}
  const rank=buzz.findIndex(x=>x.id===pid);
  if(rank>=0){
    if(cur()?.id===pid)setP('win','回答権！',(rank+1)+'番','大きな声で答えてください');
    else setP('wait',`${rank+1}番目に押しました`,(rank+1)+'番','前の人が間違えると回答権が回ってきます',false);
    return}
  if(pressed===S.round){setP('sent','送信中…','…','',false);return}
  setP('open','押せ！','押す','',true);
}

function watchRound(round){
  unsubRound.forEach(f=>f());unsubRound=[];buzz=[];out={};
  if(!round)return;
  let prev=0;
  unsubRound.push(onValue(R(`buzz/${round}`),snap=>{
    const v=snap.val()||{};
    buzz=Object.entries(v).map(([id,x])=>({id,name:clip(x.name),t:x.t||0})).sort((a,b)=>a.t-b.t||(a.id<b.id?-1:1));
    if(role==='host'&&buzz.length>prev)(prev===0?sfx.buzz:sfx.next)();
    prev=buzz.length;render();
  }));
  unsubRound.push(onValue(R(`out/${round}`),snap=>{out=snap.val()||{};render()}));
}
function subscribe(){
  let lastRound=null;
  onValue(R('state'),snap=>{S=snap.val()||{q:0,round:0,status:'idle'};if(S.round!==lastRound){lastRound=S.round;watchRound(S.round)}render()});
  onValue(R('scores'),snap=>{scores=snap.val()||{};render()});
  if(role==='host')onValue(R('players'),snap=>{players=snap.val()||{};render()});
}

// ---- 操作：プレイヤー ----
function press(){
  if(role!=='player'||S.status!=='open'||$('buzz').disabled)return;
  pressed=S.round;sfx.tap();vib(20);
  const b=$('buzz');b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),120);
  set(R(`buzz/${S.round}/${pid}`),{name:myName,t:serverTimestamp()});
  renderPlayer();
}
$('buzz').addEventListener('pointerdown',e=>{e.preventDefault();press()});
document.addEventListener('keydown',e=>{if(role==='player'&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();press()}});

$('asP').onclick=async()=>{
  const m=$('jmsg');m.textContent='';
  const c=$('code').value.trim();
  if(!/^\d{4}$/.test(c)){m.textContent='部屋番号（4桁）を入力してください';$('code').focus();return}
  myName=clip($('nm').value.trim());
  if(!myName){m.textContent='名前を入力してください';$('nm').focus();return}
  $('asP').disabled=true;
  code=c;
  const ex=await get(R('state')).catch(()=>null);
  $('asP').disabled=false;
  if(!ex||!ex.exists()){m.textContent=`部屋 ${c} が見つかりません。番号を確認してください`;return}
  ls.set('hy_name',myName);
  role='player';
  const me=R(`players/${pid}`);set(me,{name:myName});onDisconnect(me).remove();
  onValue(ref(db,'.info/connected'),s=>{if(s.val()){set(me,{name:myName});onDisconnect(me).remove()}});
  history.replaceState(null,'','?r='+code);
  $('join').classList.add('hide');$('player').classList.remove('hide');
  $('pRoom').textContent=code;$('pName').textContent=myName;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  subscribe();
};

// ---- 操作：司会 ----
$('start').onclick=()=>{sfx.start();set(R('state'),{q:(S.q||0)+1,round:Date.now(),status:'open'})};
$('right').onclick=()=>{const c=cur();if(!c)return;sfx.ok();update(R('scores'),{[c.name]:increment(1)});update(R('state'),{status:'idle'});toast(`${c.name} さん 正解！ +1`)};
$('wrong').onclick=()=>{const c=cur();if(!c)return;sfx.ng();set(R(`out/${S.round}/${c.id}`),true)};
$('stop').onclick=()=>update(R('state'),{status:'idle'});
$('reset').onclick=()=>{const b=$('reset');if(b.dataset.c){remove(R('scores'));delete b.dataset.c;b.textContent='スコアをリセット';toast('スコアをリセットしました')}else{b.dataset.c=1;b.textContent='もう一度押すとリセットします';setTimeout(()=>{delete b.dataset.c;b.textContent='スコアをリセット'},3000)}};

const joinUrl=()=>location.origin+location.pathname+'?r='+code;
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(joinUrl());toast('参加リンクをコピーしました')}catch(e){toast(joinUrl())}};
$('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'早押しクイズ',text:`部屋番号 ${code} で参加してね`,url:joinUrl()})}catch(e){}}else $('copy').click()};
if(!navigator.share)$('share').classList.add('hide');

async function startHost(existing){
  if(existing){code=existing}
  else{
    for(let i=0;i<10;i++){
      code=String(Math.floor(1000+Math.random()*9000));
      const ex=await get(R('state')).catch(()=>null);
      if(!ex||!ex.exists()||Date.now()-(ex.val().round||ex.val().created||0)>6*3600e3)break;
    }
    await set(ref(db,`rooms/${code}`),{state:{q:0,round:0,status:'idle',created:Date.now()}});
  }
  ls.set('hy_host',JSON.stringify({code,at:Date.now()}));
  role='host';
  $('join').classList.add('hide');$('host').classList.remove('hide');
  $('hcode').textContent=code;
  try{new QRCode($('qr'),{text:joinUrl(),width:264,height:264,colorDark:'#0b0d1a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){$('qr').classList.add('hide')}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  subscribe();
}
$('asH').onclick=()=>{$('asH').disabled=true;startHost().catch(()=>{$('asH').disabled=false;toast('部屋を作れませんでした。通信を確認してください')})};
</script>
